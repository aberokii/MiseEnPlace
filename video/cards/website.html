<!doctype html><title>website</title><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap"><link rel="stylesheet" href="../../components/audit/audit.css"><link rel="stylesheet" href="card.css">
<style>
.browser{max-width:1320px;transform:scale(1)}
.browser .bb{height:760px;display:block;padding:0;text-align:left;overflow:hidden;position:relative}
.site{position:absolute;left:0;right:0;top:0;animation:scrollsite 5.5s var(--ease) both;animation-delay:4200ms;font-family:Inter,sans-serif}
@keyframes scrollsite{to{transform:translateY(var(--scroll,-760px))}}
.hero{padding:64px 72px 48px;border-bottom:1px solid #EBEBEB}
.hero .logo{font-size:52px;display:block;margin-bottom:14px}
.hero p{font-size:24px;color:var(--mute);margin:0 0 24px}
.hero .chips{display:flex;gap:10px}
.hero .chip{height:36px;font-size:16px;padding:0 16px}
.sec{padding:40px 72px;border-bottom:1px solid #EBEBEB;display:grid;grid-template-columns:260px 1fr;gap:24px}
.sec h3{margin:0;font-size:22px}
.sec .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;font-size:19px}
.sec .menu span{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0}
.sec p{margin:0;font-size:19px;line-height:1.5}
.imp{background:var(--soft)}
.imp p{font-size:17px;color:#484848}
.imp .st{margin-left:12px;vertical-align:middle}
.cap{position:absolute;left:120px;top:72px;display:flex;align-items:center;gap:16px}
.cap .st.big{height:56px;font-size:22px}
.cap h2{margin:0;font-size:40px;letter-spacing:-.03em}
.skel{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;gap:18px;padding:64px 72px;animation:fo 500ms var(--ease) both;animation-delay:3600ms}
.skel i{display:block;height:28px;border-radius:999px;background:#F2F2F2;animation:shim 1.1s linear infinite}
@keyframes shim{50%{background:#E6E6E6}}
.skel i:nth-child(1){width:40%;height:52px}.skel i:nth-child(2){width:70%}.skel i:nth-child(3){width:55%}.skel i:nth-child(4){width:80%;margin-top:30px}.skel i:nth-child(5){width:62%}
.spinwrap{position:absolute;left:72px;bottom:48px;display:flex;align-items:center;gap:12px;font-size:18px;color:var(--mute)}
</style>
<div class="frame" style="align-items:flex-end;padding-bottom:80px">
  <div class="cap"><h2 class="in" style="--d:0ms">Build it: your website</h2><span class="st big have pop" style="--d:4000ms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg> Built in 38 s, Impressum included</span></div>
  <div class="browser pop" style="--d:200ms">
    <div class="bh"><i></i><i></i><i></i><div class="url" id="url">cafelevent.de</div></div>
    <div class="bb">
      <div class="site" id="site"></div>
      <div class="skel"><i></i><i></i><i></i><i></i><i></i><div class="spinwrap"><span class="spin"></span>Claude is writing your page…</div></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
window.build=(D)=>{const w=D.hypothetical.website,b=D.business;
document.getElementById('site').innerHTML=
'<div class="hero"><span class="logo">'+w.title+'</span><p>'+w.tagline+'</p><div class="chips">'+w.sections.map(s=>'<span class="chip">'+s+'</span>').join('')+'</div></div>'+
'<div class="sec"><h3>Menu</h3><div class="menu">'+w.menu.map(m=>{const [a,p]=m.split(' · ');return '<span>'+a+'<b>'+p+' €</b></span>'}).join('')+'</div></div>'+
'<div class="sec"><h3>Hours</h3><p>'+b.hours+'</p></div>'+
'<div class="sec"><h3>Find us</h3><p>'+b.address+'</p></div>'+
'<div class="sec imp"><h3>Impressum<span class="st have"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg> legally required</span></h3><div>'+w.impressum.map(l=>'<p>'+l+'</p>').join('')+'</div></div>';
const el=document.getElementById('site');el.style.setProperty('--scroll',(-(el.scrollHeight-760))+'px');
};
</script>
