<!doctype html><title>after</title><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap"><link rel="stylesheet" href="../../components/audit/audit.css"><link rel="stylesheet" href="card.css">
<style>
.sum{width:1680px;margin:0;grid-template-columns:auto minmax(0,1.1fr) minmax(0,1fr);gap:56px;padding:56px}
.ringbox{width:300px;height:300px}
.ringbox .n b{font-size:84px}
.ringbox .n span{font-size:20px}
.sum h1{font-size:52px;margin:0 0 18px}
.legend .st.big{height:52px;font-size:21px}
.legend{gap:12px;margin-top:10px}
.next h4{font-size:18px}
.nx{font-size:24px;padding:18px 22px;border-radius:22px}
.nx .num{width:36px;height:36px;font-size:16px}
.nx .ef{font-size:16px}
#arc{stroke-dasharray:848;animation:arc 2.4s var(--ease) both;animation-delay:900ms}
@keyframes arc{from{stroke-dashoffset:var(--from)}to{stroke-dashoffset:var(--to)}}
.flip{position:relative;display:inline-grid}
.flip .st{grid-area:1/1}
.flip .st.missing{animation:fo 300ms var(--ease) both;animation-delay:var(--d)}
.flip .st.have{animation:pp 420ms var(--ease) both;animation-delay:var(--d)}
.cnt{font-variant-numeric:tabular-nums}.ringbox .n b span{font-size:inherit;color:inherit;margin:0}
</style>
<div class="frame"><div class="sum pop">
  <div class="ringbox"><svg width="300" height="300" viewBox="0 0 300 300"><circle cx="150" cy="150" r="135" fill="none" stroke="#EBEBEB" stroke-width="18"/><circle id="arc" cx="150" cy="150" r="135" fill="none" stroke="#FF385C" stroke-width="18" stroke-linecap="round"/></svg><div class="n"><b class="cnt" id="score">21</b><span>of 100</span></div></div>
  <div><p class="eyebrow in">Café Le Vent · after today</p><h1 class="in" style="--d:150ms">Two things built. Three to go.</h1><div class="legend" id="lg"></div></div>
  <div class="next in" style="--d:3800ms"><h4>Your next three steps</h4><div id="nx"></div></div>
</div></div>
<script src="common.js"></script>
<script>
window.build=(D)=>{const C=848,b=D.scoreBefore,a=D.scoreAfter;const arc=document.getElementById('arc');arc.style.setProperty('--from',C*(1-b/100));arc.style.setProperty('--to',C*(1-a/100));
// score counter: one element per value, shown for a slice of the 2.4 s sweep
const s=document.getElementById('score');let h='';const steps=a-b;for(let i=0;i<=steps;i++){const d=900+Math.round(2400*(i/steps)*(2-i/steps)/1);h+='<span class="hold" style="grid-area:1/1;--d:'+d+'ms;position:absolute;inset:-8px -16px;display:flex;align-items:center;justify-content:center;background:#fff">'+(b+i)+'</span>';}
s.style.position='relative';s.style.display='inline-block';s.innerHTML='<span style="visibility:hidden">'+a+'</span>'+h;
const flips=[['No website','1400ms'],['No Impressum','2000ms'],['Reviews unanswered','2600ms']];
document.getElementById('lg').innerHTML=flips.map(([l,d])=>'<span class="flip" style="--d:'+d+'"><span class="st big missing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'+l+'</span><span class="st big have"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>'+l.replace('No ','').replace(/^w/,'W').replace('Reviews unanswered','Reviews answered')+(l.startsWith('No ')?' live':'')+'</span></span>').join('');
document.getElementById('nx').innerHTML=D.hypothetical.nextSteps.map((n,i)=>'<div class="nx in" style="--d:'+(4200+i*400)+'ms"><span class="num">'+n.n+'</span>'+n.label+'<span class="ef">'+n.effort+'</span></div>').join('')};
</script>
