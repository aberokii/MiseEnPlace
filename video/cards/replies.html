<!doctype html><title>replies</title><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap"><link rel="stylesheet" href="../../components/audit/audit.css"><link rel="stylesheet" href="card.css">
<style>
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:1680px}
.rv{padding:26px 28px;gap:14px;min-height:560px}
.rv .rh{font-size:16px}
.rv p{font-size:19px;line-height:1.5}
.rv .stars svg{width:18px;height:18px}
.reply{margin-top:auto;border-top:1px solid #EBEBEB;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.reply .k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--mute)}
.reply .k .av{width:28px;height:28px;border-radius:999px;font-size:11px}
.reply p{font-size:18px;color:var(--ink)}
.cap{position:absolute;left:120px;top:72px;display:flex;align-items:center;gap:16px}
.cap h2{margin:0;font-size:40px;letter-spacing:-.03em}
.cap .st.big{height:56px;font-size:22px}
.cap .st.missing{animation:fu 600ms var(--ease) both, fo 400ms var(--ease) both;animation-delay:200ms,3000ms}
</style>
<div class="frame" style="align-items:flex-end;padding-bottom:80px">
  <div class="cap"><h2 class="in">Build it: review replies</h2><span class="st big missing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg> 0 of 3 answered</span><span class="st big have pop" style="--d:9200ms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg> 3 drafts, in the owner's voice</span></div>
  <div class="cols" id="c"></div>
</div>
<script src="common.js"></script>
<script>
function stars(n){let s='';for(let i=0;i<5;i++)s+='<svg viewBox="0 0 24 24" fill="'+(i<n?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';return s;}
window.build=(D)=>{document.getElementById('c').innerHTML=D.hypothetical.replies.map((r,i)=>
'<div class="rv pop" style="--d:'+(400+i*300)+'ms"><div class="rh"><span class="stars">'+stars(r.rating)+'</span><span>Google · Sep 2026 · no owner reply</span></div><p>'+r.review+'</p>'+
'<div class="reply in" style="--d:'+(3400+i*1600)+'ms"><div class="k"><span class="av">LV</span>Draft reply from the owner</div><p>'+r.reply+'</p></div></div>').join('')};
</script>
