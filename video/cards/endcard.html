<!doctype html><title>endcard</title><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap"><link rel="stylesheet" href="../../components/audit/audit.css"><link rel="stylesheet" href="card.css">
<style>
.frame{flex-direction:column;gap:36px;text-align:center}
.frame .logo{font-size:120px}
.pitch{font-size:40px;line-height:1.3;letter-spacing:-.02em;font-weight:600;max-width:1300px;margin:0;color:var(--ink)}
.meta{display:flex;gap:14px;justify-content:center}
.chip.big{height:52px;font-size:22px;padding:0 24px}

  <p class="url in" style="--d:3200ms"><b>github.com/aberokii/MiseEnPlace</b></p>
</div>
