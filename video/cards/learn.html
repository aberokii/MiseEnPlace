<!doctype html><title>learn</title><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap"><link rel="stylesheet" href="../../components/audit/audit.css"><link rel="stylesheet" href="card.css">
<style>
.card.learn{width:1400px;padding:48px 56px;border-radius:32px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.card.learn h2{margin:0 0 28px;font-size:44px;letter-spacing:-.03em;display:flex;align-items:center;gap:18px}
.card.learn h2 .ico{width:56px;height:56px;background:var(--pink);color:var(--red)}
.card.learn h2 .ico svg{width:28px;height:28px}
.nx{font-size:26px;padding:20px 24px;border-radius:22px}
.nx .num{width:40px;height:40px;font-size:18px}
.next{gap:14px}
</style>
<div class="frame"><div class="card learn pop">
  <h2><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/></svg></span><span id="t"></span></h2>
  <div class="next" id="n"></div>
</div></div>
<script src="common.js"></script>
<script>
window.build=(D)=>{const L=D.hypothetical.learn;document.getElementById('t').textContent=L.title;
document.getElementById('n').innerHTML=L.lines.map((l,i)=>'<div class="nx in" style="--d:'+(900+i*1700)+'ms"><span class="num">'+(i+1)+'</span>'+l+'</div>').join('')};
</script>
